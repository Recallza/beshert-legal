<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <!-- The address this page opens at can carry a sign-in token. No referrer,
       so following a link from here never passes that address on. -->
  <meta name="referrer" content="no-referrer">
  <title>Email verified | Beshert</title>
  <style>
    :root { --cream: #FEF9F6; --line: #E8DFDA; --navy: #24284F; --muted: #6B6F8C; --coral: #E77B83; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--cream); color: var(--navy); padding: 24px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    main { width: 100%; max-width: 420px; background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 32px 24px; text-align: center; }
    .mark { width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; background: var(--cream); border: 1px solid var(--line); font-size: 28px; }
    h1 { font-size: 24px; margin: 0 0 8px; }
    p { color: var(--muted); line-height: 1.5; margin: 0 0 16px; }
    a.button { display: block; background: var(--coral); color: #fff; text-decoration: none; font-weight: 700; padding: 14px; border-radius: 10px; margin-bottom: 10px; }
    a.secondary { display: block; color: var(--navy); border: 1px solid var(--line); text-decoration: none; font-weight: 700; padding: 13px; border-radius: 10px; }
    .fine { font-size: 13px; margin-top: 20px; margin-bottom: 0; }
    a:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" id="mark" aria-hidden="true">&#10003;</div>
    <h1 id="title">Your email is verified</h1>
    <p id="detail">Your Beshert account is ready. Open the app and sign in with your email and password.</p>
    <a class="button" id="open" href="beshert://auth-callback">Open Beshert</a>
    <a class="secondary" href="https://play.google.com/store/apps/details?id=za.co.beshert.app">Get Beshert on Google Play</a>
    <p class="fine" id="fine">On a computer? You can close this page and sign in on your phone.</p>
  </main>
  <script>
    (function () {
      // Supabase sends people here after they tap the confirmation link in
      // their email. By then the email is already confirmed. The address may
      // carry the new session, as ?code=... or #access_token=...&refresh_token=...
      // "Open Beshert" hands exactly that on to the app, whose link handler
      // (AuthContext, establishSessionFromUrl) signs them straight in, the
      // same as when the email linked to the app directly.
      var query = new URLSearchParams(location.search);
      var hash = new URLSearchParams(location.hash.replace(/^#/, ''));
      var error = query.get('error') || hash.get('error');
      var errorCode = query.get('error_code') || hash.get('error_code');

      // Keep tokens out of the address bar and browser history once read.
      var carried = location.search + location.hash;
      if (carried) history.replaceState(null, '', location.pathname);

      if (error) {
        document.getElementById('mark').textContent = '!';
        document.getElementById('title').textContent =
          errorCode === 'otp_expired' ? 'This link has expired' : 'This link did not work';
        document.getElementById('detail').textContent =
          'Confirmation links only work once, and only for a while. Try signing in to Beshert. ' +
          'If it says your email is not confirmed, sign up again and we will send a new link.';
        document.getElementById('open').href = 'beshert://';
        document.getElementById('fine').hidden = true;
        return;
      }

      // Only the parts the app knows how to use are passed on.
      var forward = new URLSearchParams();
      ['code', 'type'].forEach(function (key) {
        if (query.get(key)) forward.set(key, query.get(key));
      });
      var fragment = new URLSearchParams();
      ['access_token', 'refresh_token', 'expires_in', 'expires_at', 'token_type', 'type'].forEach(function (key) {
        if (hash.get(key)) fragment.set(key, hash.get(key));
      });
      var link = 'beshert://auth-callback';
      if (forward.toString()) link += '?' + forward.toString();
      if (fragment.toString()) link += '#' + fragment.toString();
      document.getElementById('open').href = link;
    })();
  </script>
</body>
</html>
